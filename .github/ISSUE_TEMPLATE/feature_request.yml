name: Feature request / 功能建议
description: Suggest a focused improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would this help you do? / 希望解决什么问题
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Desired behavior / 期望的行为
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Examples or alternatives / 示例或替代方案
